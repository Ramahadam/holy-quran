name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analysis, tests, and persistence coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        run: bash scripts/check_dart_format.sh
      - run: flutter analyze
      - run: flutter test --coverage --exclude-tags golden
      - run: python3 scripts/check_persistence_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info

  mushaf-goldens:
    name: Mushaf visual regression
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compare canonical Mushaf renders
        run: flutter test --tags golden
      - name: Upload Mushaf golden failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-golden-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/failures/
          if-no-files-found: warn
          retention-days: 14

  worker:
    name: Worker tests and type checking
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    name: Python tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/test_fetch_quran_data.py
      - run: python3 scripts/test_verify_madani_page_boundaries.py
      - run: python3 scripts/test_import_mushaf_svg_coordinates.py
